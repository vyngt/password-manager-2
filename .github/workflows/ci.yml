name: CI

# Conservative triggers by design (slice 3.8): NO `push` trigger, so fast
# feature-branch commits never burn GitHub-hosted minutes. The core gate runs
# only on a PR into a long-lived branch, or on manual dispatch — roughly one run
# per slice. For a fully zero-minutes setup, either register a self-hosted runner
# and change `runs-on` below to `self-hosted`, or use the local Jenkins pipeline
# (`ci/jenkins/`). See `docs/testing.md`.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: fmt · lint · test · wasm · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri (vedge-tauri) links against WebKitGTK on Linux, so `cargo test`
      # needs these system libs to compile the shell crate. Flip `runs-on` to
      # `windows-latest` (WebView2, no apt step) if the Linux build is a problem.
      - name: Install Linux system deps (Tauri / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install Rust (stable + rustfmt + clippy + wasm32)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # Prebuilt binaries (fast) for the extra gate tools. `trunk` LINKS the wasm
      # bundle in the wasm-link step below (the core gate only type-checks it).
      - name: Install leptosfmt + cargo-deny + trunk
        uses: taiki-e/install-action@v2
        with:
          tool: leptosfmt,cargo-deny,trunk

      # mise is the single source of truth for the task definitions. It has no
      # `[tools]` block (the toolchain is installed above), so this just makes the
      # `mise run …` task runner available and trusts the config.
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Core gate (fmt-check + lint + test + wasm)
        run: mise run ci

      # The real wasm LINK — `mise run ci`'s wasm phase is only a `cargo check`
      # (type-check). A link-class `rust-lld` failure escaped this gap TWICE
      # (4.6b, 4.9a); `trunk build` closes it (slice 5.9 ④).
      - name: Frontend wasm LINK (trunk build)
        run: mise run wasm-link

      # The release-profile compile — `mise run ci`/`wasm-link` are both DEBUG, so
      # a release-only path (e.g. the `cfg(debug_assertions)`-gated `/playground`)
      # is otherwise compiled by no job and would fail only at `cargo tauri build`
      # time. Type-check only, so it stays cheap enough for the PR gate (PG.2a).
      - name: Release-profile compile check
        run: mise run release-check

      - name: Supply-chain audit (cargo deny)
        run: mise run audit
