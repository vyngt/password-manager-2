# mise task runner for VEdge — https://mise.jdx.dev/tasks/
#
#   mise tasks            # list tasks
#   mise run <task>       # run one (e.g. `mise run ci`)
#   mise run setup        # one-time dev setup
#
# Stack: Leptos/WASM frontend (`vedge-app`) bundled by Trunk, wrapped by a
# Tauri v2 shell (`vedge-tauri`). `cargo tauri dev` drives Trunk via
# `beforeDevCommand` in crates/vedge-tauri/tauri.conf.json.

# No `[tools]` block on purpose: it would force a tool install before *every*
# task. Install the frontend chain explicitly via `mise run setup`.

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------

[tasks.setup]
description = "One-time dev setup: wasm target + trunk + tauri-cli + leptosfmt + supply-chain tools + git hooks"
run = [
  "rustup target add wasm32-unknown-unknown",
  "cargo install trunk --locked",
  "cargo install tauri-cli --locked",
  "cargo install tauri-driver --locked",
  "cargo install leptosfmt --locked",
  "cargo install cargo-audit cargo-deny --locked",
  "cargo install cargo-about --locked --features cli",
  "git config core.hooksPath .githooks",
]

[tasks.install-hooks]
description = "Point git at the tracked .githooks/ dir (pre-commit fmt gate) — for existing clones"
# core.hooksPath is per-clone local config, not versioned; run once per clone
# (setup does it too). The hook itself lives in .githooks/ and IS versioned.
run = "git config core.hooksPath .githooks"

# ---------------------------------------------------------------------------
# Run / build
# ---------------------------------------------------------------------------

[tasks.dev]
description = "Run the desktop app (Tauri + Trunk live-reload)"
dir = "crates/vedge-tauri"
run = "cargo tauri dev"

[tasks.serve]
description = "Serve the frontend only in a browser (no Tauri; invoke calls will fail)"
run = "trunk serve --config crates/vedge-app/Trunk.toml"

[tasks.build]
description = "Release-build the desktop app bundle"
dir = "crates/vedge-tauri"
run = "cargo tauri build"

# ---------------------------------------------------------------------------
# Format
# ---------------------------------------------------------------------------

[tasks.fmt]
alias = "format"
description = "Format all Rust code (rustfmt) + `view!` macros (leptosfmt)"
# rustfmt first (it skips macro bodies), then leptosfmt for the `view!` internals.
run = ["cargo fmt --all", "leptosfmt crates/vedge-app crates/vedge-ui"]

[tasks.fmt-check]
description = "Check rustfmt + leptosfmt formatting without writing"
run = [
  "cargo fmt --all -- --check",
  "leptosfmt --check crates/vedge-app crates/vedge-ui",
]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------

[tasks.lint]
alias = "clippy"
description = "Clippy gate — whole workspace under -D warnings (vedge-e2e excluded)"
# Since 2.10.1 every member crate opts into `[lints] workspace = true` (vedge-app +
# vedge-ui adopted it), so a single whole-workspace pass replaces the old split
# (backend-strict + vedge-app `--no-deps` + informational `lint-ui`). `vedge-e2e` is
# excluded — it's unwrap-heavy harness code that deliberately opts out, matching the
# `test` gate.
run = "cargo clippy --workspace --exclude vedge-e2e --all-targets -- -D warnings"

# ---------------------------------------------------------------------------
# Supply-chain audit
# ---------------------------------------------------------------------------

[tasks.audit]
description = "Supply-chain gate — cargo-deny (advisories/bans/licenses/sources), build-graph aware"
# `cargo deny check` IS the gate. It is target + feature + build-graph aware, so it
# reports advisories only for crates we actually compile. Config: /deny.toml.
#
# `cargo audit` is installed (mise setup) but deliberately NOT run in the gate: it
# scans the raw Cargo.lock feature-union and over-reports crates that are NOT in our
# build — e.g. `rsa` (RUSTSEC-2023-0071) and `quinn-proto` (RUSTSEC-2026-0185), both
# of which `cargo tree -i` confirms are unused (feature-gated behind sqlx/quic
# features we never enable). Gating on those would mean writing misleading `ignore`s
# for CVEs in crypto crates we don't even compile. Run `cargo audit` manually for a
# raw-lockfile view. Needs network (RustSec DB). Not in `ci`; see docs/testing.md.
run = "cargo deny check"

# ---------------------------------------------------------------------------
# Third-party attribution (PG.3, Gate 1.0 §D ⑥)
# ---------------------------------------------------------------------------

# Regenerate the committed third-party attribution artifacts from the SHIPPED
# dependency graph (build-graph aware via about.toml's `targets` = windows +
# wasm32). NOT a build-time step and NOT in `ci`: the artifacts are committed so
# they are reviewable in a diff and reproducible without cargo-about installed —
# this only regenerates them after a dependency change. Two outputs:
#   1. a structured JSON (id + crates only, no licence text) that the About tab
#      `include_str!`s and renders NATIVELY (no inner_html → no CSP loosening);
#   2. THIRD-PARTY-NOTICES.txt — the full licence texts, bundled with the app
#      (tauri.conf.json `bundle.resources`).
# `--workspace` because the manifest is virtual (no root package).
[tasks.about]
description = "Regenerate the committed third-party licence attribution (JSON + THIRD-PARTY-NOTICES.txt) via cargo-about"
run = [
  "cargo about generate --workspace about/licenses.json.hbs -o crates/vedge-app/src/features/settings/third-party-licenses.json",
  "cargo about generate --workspace about/notices.txt.hbs -o THIRD-PARTY-NOTICES.txt",
]

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

[tasks.test]
description = "Workspace test gate (lib + bins + tests; doctests excluded)"
# `vedge-e2e` is excluded: it depends on a running `tauri-driver` + a display and
# is `#[ignore]`-gated. Excluding it keeps the default gate from *compiling* its
# WebDriver deps on every run. Its scenario runs via the `e2e` task below.
run = "cargo test --workspace --exclude vedge-e2e --lib --bins --tests"

[tasks.test-app]
description = "Fast frontend host tests only"
run = "cargo test -p vedge-app"

[tasks.bench]
description = "Unlock benchmark — O(n) index-build loop at 100/1k/10k entries (slice 5.3c, hard gate 2). NOT in `ci`; run to decide slice 5.5. `--release` so the numbers reflect production crypto, not a debug build."
run = "cargo test --release -p vedge-core --test unlock_bench -- --ignored --nocapture"

[tasks.bench-ops]
description = "Operation benchmark (PG.1 ⑦, Gate 1.0 §G) — times create_entry/update_entry/create_snapshot/rekey_vault at 100/1k/10k entries, plus a re-key of a ~384 MB large-blob vault (re-key is O(total plaintext bytes), the worst case). NOT in `ci`; writes ~384 MB to a temp dir. `--release` for production crypto."
run = "cargo test --release -p vedge-core --test operation_bench -- --ignored --nocapture"

[tasks.kill-smoke]
description = "Kill-mid-restore smoke (slice 5.9 ①) — hard-kill a real process at each journal state via the `VEDGE_RESTORE_PAUSE` seam, then prove a fresh process re-opens the home consistently. Debug build (the seam is `cfg(debug_assertions)`); NOT in `ci`."
run = "cargo test -p vedge-core --test kill_mid_restore -- --ignored --exact kill_mid_restore_smoke --nocapture"

[tasks.e2e]
description = "End-to-end WebDriver run (tauri-driver + thirtyfour; needs a display + platform driver)"
dir = "crates/vedge-tauri"
# 1. Build the frontend as DEBUG wasm (NO --release) so the Leptos
#    reactive-context warning is compiled in for the console-clean guard.
# 2. Embed dist/ into the host binary with `custom-protocol` (a plain
#    `cargo build` would run in dev mode and load devUrl → blank window).
# 3. The harness spawns `tauri-driver` itself; run serial (single-instance).
run = [
  "trunk build --config ../vedge-app/Trunk.toml",
  "cargo build -p vedge-tauri --features custom-protocol",
  "cargo test -p vedge-e2e -- --ignored --test-threads=1",
]

# Regenerate the PG.5b user-guide screenshots (docs/guide/images/) by driving the
# real app through the e2e harness — re-running this IS the screenshot refresh
# process (PG.5b Decision ④), so shots never drift from the shipped UI. Same
# build steps as `e2e`; runs ONLY the `screenshots` scenario. Needs a display +
# platform driver (msedgedriver). Override the output dir with `VEDGE_SHOTS_DIR`.
# NOT in `ci`.
[tasks.screenshots]
description = "Capture the user-guide screenshots into docs/guide/images (PG.5b) via the e2e harness"
dir = "crates/vedge-tauri"
run = [
  "trunk build --config ../vedge-app/Trunk.toml",
  "cargo build -p vedge-tauri --features custom-protocol",
  "cargo test -p vedge-e2e --test screenshots -- --ignored --test-threads=1 --nocapture",
]

# ---------------------------------------------------------------------------
# OS keychain hygiene
#
# 🔴 The e2e suite does NOT fake the keychain — it drives the real OS credential store, because
# that is the only way to actually test it. So every run leaves real entries behind: a Secret Key
# (`secret:{uuid}`) + a rollback baseline (`counter:{uuid}`) per vault, and another pair for each
# duplicate that slice 5.2.2's ② opens. Dev runs against throwaway vaults do the same. They are
# keyed on an opaque ULID, so you cannot tell an orphan from a real vault's key by looking — and
# deleting the wrong one destroys a vault (recoverable only via its Emergency Kit).
#
# Two defences:
#   1. e2e writes under its OWN service (`vedge-e2e-test`, debug-only + env-gated), so its
#      entries are always identifiable and always safe to bulk-delete → `mise e2e-clean`.
#   2. For the production `vedge` service, `keychain-audit` decides orphan-vs-live from EVIDENCE
#      — the uuids of the vaults you actually have registered and on disk — and refuses to delete
#      anything if it cannot see them. Read `scripts/keychain_audit.ps1` before trusting it.
# ---------------------------------------------------------------------------

[tasks.keychain-audit]
description = "Report which VEdge keychain entries are orphans (dry run — deletes nothing)"
run = "pwsh -NoProfile -File scripts/keychain_audit.ps1"

[tasks.keychain-clean]
description = "🔴 Delete the orphaned VEdge keychain entries (keeps every registered vault's key)"
run = "pwsh -NoProfile -File scripts/keychain_audit.ps1 -Delete"

[tasks.e2e-clean]
description = "Purge the keychain entries left by e2e runs (always safe — never touches a real vault)"
run = "pwsh -NoProfile -File scripts/keychain_audit.ps1 -Service vedge-e2e-test -Delete"

# Prove — from evidence, never deletes — that no pre-5.2 legacy artifact (a bare `<name>.vdb`
# file, a `vault:*` keychain account, a path-hashed biometric credential, a null vault_uuid)
# survives on this machine. It must be GREEN before slice 5.2.5 retires the migration code, since
# that code is the only thing that could ever reach such an artifact. Cannot-see ⇒ FAIL.
[tasks.legacy-audit]
description = "Prove no legacy (.vdb / vault:* / path-hashed) artifact remains — read-only, exit 0 only if clean"
run = "pwsh -NoProfile -File scripts/legacy_audit.ps1"

# Prove — from evidence — that no pre-5.6.0 KEK-sealed tag (`tags.dek_wrapped IS NULL`) survives on
# any reachable surface (live vaults, snapshots, scannable `.vbk`s), so slice 5.9 ② can retire the
# legacy-tag read path. Cannot-see ⇒ FAIL; if it can't be made GREEN, the honest outcome is keep.
[tasks.tag-legacy-audit]
description = "Prove no legacy (KEK-sealed) tag remains — read-only, exit 0 only if clean (slice 5.9 ②)"
run = "pwsh -NoProfile -File scripts/tag_legacy_audit.ps1"

# ---------------------------------------------------------------------------
# Frontend wasm type-check
# ---------------------------------------------------------------------------

[tasks.wasm]
alias = "wasm-check"
description = "Type-check the frontend on the wasm32 target (the real build target)"
# The generator crate is checked standalone too: it's the only crate that puts
# `getrandom`/`rand` on the wasm runtime, and its browser-RNG backend is a
# `compile_error!` that only fires on wasm32 — an isolated check keeps that
# signal even if vedge-app ever drops the dep. (vedge-app pulls it transitively.)
run = [
  "cargo check -p vedge-generator --target wasm32-unknown-unknown",
  "cargo check -p vedge-app --target wasm32-unknown-unknown",
]

[tasks.wasm-link]
description = "LINK the frontend wasm bundle (trunk build) — the real link `wasm`/`wasm-check` (a cargo check) never performs. Catches link-class `rust-lld` failures a type-check can't (escaped TWICE: 4.6b, 4.9a)."
# Debug build (no --release), matching `e2e`: the `rust-lld` crash was a *debug*
# wasm + debuginfo failure, so a debug link is the one that gates the class (the
# `.cargo/config.toml` `debuginfo=0` workaround must stay). Deliberately NOT a
# `depends` of `ci` — a full link is minutes, and folding it into `ci` would tax
# every local `mise ci`. It runs as its own CI step (ci.yml) + before a release.
run = "trunk build --config crates/vedge-app/Trunk.toml"

# ---------------------------------------------------------------------------
# Release-profile compile gate
# ---------------------------------------------------------------------------

# 🔴 The third member of the "a build configuration nobody verifies" family (PG.2a).
# `mise ci`'s wasm phase is a `cargo check` DEBUG; `wasm-link` is a `trunk build`
# DEBUG; the release bundle is only ever built locally by `mise build`. So a
# release-ONLY code path — the one `#[cfg(debug_assertions)]`-gating `/playground`
# introduces — is compiled by NO existing job: an ungated `use` → unused-import →
# `-D warnings` would pass CI and fail only at release. This type-check closes that
# gap cheaply. Its own `ci.yml` step beside `wasm-link`; deliberately NOT a
# `depends` of local `ci` (a release check is minutes — keep the local gate fast,
# 5.9's reasoning for `wasm-link`).
[tasks.release-check]
description = "Release-profile compile gate (PG.2a) — type-check the workspace + frontend wasm under --release. Catches release-only breakage no debug job compiles. Its own ci.yml step; NOT in local `ci`."
run = [
  "cargo check --workspace --exclude vedge-e2e --release",
  "cargo check -p vedge-app --target wasm32-unknown-unknown --release",
]

# ---------------------------------------------------------------------------
# Aggregate
# ---------------------------------------------------------------------------

[tasks.ci]
description = "Full local CI: format check, lint, test, wasm check"
depends = ["fmt-check", "lint", "test", "wasm"]

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"
