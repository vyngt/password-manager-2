[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
dotenvy = "0.15.7"
rand = "0.9.2"
thiserror = "2.0.16"
anyhow = "1.0.99"
validator = { version = "0.20.0", features = ["derive"] }
async-trait = "0.1.89"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
tokio = { version = "1.47.1", features = ["test-util", "macros", "rt-multi-thread"] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher", "bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4.42", features = ["serde"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
codegen = { path = "../codegen"}

[dependencies.sea-orm]
version = "1.1.16"
features = ["sqlx-sqlite", "runtime-tokio", "macros", "sqlite-use-returning-for-3_35"]
default-features = false

[dependencies.sea-orm-migration]
version = "1.1.16"
features = ["runtime-tokio", "sqlx-sqlite", "sqlite-use-returning-for-3_35", "with-chrono", "with-time", "with-uuid"]
default-features = false
