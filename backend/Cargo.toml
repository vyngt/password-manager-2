[package]
name = "backend"
version = "2.0.0"
description = "Password Manager"
authors = ["VyNT <vyngt@outlook.com>"]
license = ""
repository = "https://github.com/vyngt/password-manager-2"
default-run = "backend"
edition = "2024"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "backend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
diesel = { version = "2.3.1", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35", "r2d2"] }
diesel_migrations = { version = "2.3.0", features = ["sqlite"] }
dotenvy = "0.15.7"
rand = "0.9.2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
thiserror = "2.0.16"
anyhow = "1.0.99"
validator = { version = "0.20.0", features = ["derive"] }
async-trait = "0.1.89"
uuid = { version = "1.18.1", features = ["v4"] }
tokio = "1.47.1"
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher", "bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4.42", features = ["serde"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"

[dependencies.sea-orm]
version = "1.1.16"
features = ["sqlx-sqlite", "runtime-tokio", "macros", "sqlite-use-returning-for-3_35"]
default-features = false

[dependencies.sea-orm-migration]
version = "1.1.16"
features = ["runtime-tokio", "sqlx-sqlite", "sqlite-use-returning-for-3_35", "with-chrono", "with-time", "with-uuid"]
default-features = false


[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
