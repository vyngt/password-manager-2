# cargo-about configuration — third-party attribution (PG.3, Gate 1.0 §D ⑥).
#
# `cargo deny check licenses` (deny.toml) answers "are these licences acceptable?".
# This answers the *distribution* obligation it does NOT: "have we reproduced the
# notices those licences REQUIRE?" (MIT: copyright notice in all copies; Apache-2.0
# §4: the licence + NOTICE). cargo-about is build-graph aware, so it attributes the
# crates that actually SHIP, not every Cargo.lock entry.
#
# Regenerate the committed artifacts with `mise about`. The `accepted` list mirrors
# deny.toml's permissive allowlist — keep them in sync.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
]

# The shipped platforms: the Windows native shell + the wasm32 frontend. The union
# of both graphs is what a release bundles.
targets = [
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

# Attribute only what ships in the binary — build- and dev-only crates are not
# distributed, so they carry no notice obligation.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
