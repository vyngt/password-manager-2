[package]
name = "vedge-generator"
version = "0.1.0"
edition = "2024"
publish = false

# Pure secret-generation engine — no SQLite, no OS integration, no serde/DB.
# Compiles to BOTH native (OS RNG) and wasm32 (browser crypto.getRandomValues),
# so the Leptos/WASM UI calls it with zero IPC and native CLI/server shells reuse
# the same code. This is the "one code path" the entropy meter depends on.
[dependencies]
rand = "0.10"          # defaults: std_rng + sys_rng + thread_rng; pulls getrandom 0.4 (OS backend natively)
zeroize = "1"          # Zeroizing<String> — the generated secret is wiped on drop

# On wasm32-unknown-unknown, getrandom 0.4 needs the `wasm_js` feature to select the
# browser backend (feature-only in the 0.4 era — no RUSTFLAGS / .cargo/config cfg).
# Feature-unifies onto rand's getrandom 0.4 instance. Already resolved in Cargo.lock,
# so this adds zero new crate versions.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# Test-only: assert the embedded EFF wordlist's SHA-256 so an accidental edit or
# re-encoding fails CI. Version matches vedge-core, so Cargo.lock gains nothing;
# kept out of [dependencies] so it never reaches the wasm/runtime surface.
[dev-dependencies]
sha2 = "0.11"

[lints]
workspace = true
