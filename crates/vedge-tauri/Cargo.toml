[package]
name        = "vedge-tauri"
version     = "3.0.0"
description = "Vedge Tauri shell"
authors     = ["VyNT <vyngt@outlook.com>"]
edition     = "2024"
default-run = "vedge-tauri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows.
# See https://github.com/rust-lang/cargo/issues/8519.
name       = "vedge_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vedge-core = { path = "../vedge-core" }

tauri                             = { version = "2", features = [] }
tauri-plugin-shell                = "2"
tauri-plugin-notification         = "2"
tauri-plugin-dialog               = "2"
tauri-plugin-process              = "2"
tauri-plugin-fs                   = "2"
tauri-plugin-clipboard-manager    = "2.3.2"
tauri-plugin-http                 = "2"
tauri-plugin-os                   = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tracing     = "0.1"
thiserror   = "2"
async-trait = "0.1"
base64      = "0.22"
chrono      = { version = "0.4", default-features = false, features = ["std", "serde"] }
secrecy     = "0.10"
zeroize     = "1"

# Emergency Kit PDF rendering. Both crates are pure-Rust and pull in no C deps.
printpdf    = { version = "0.7", features = ["embedded_images"] }
qrcodegen   = "1.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[features]
# DO NOT REMOVE — used by `cargo tauri build` / `cargo tauri dev`.
custom-protocol = ["tauri/custom-protocol"]

# Feature flags mirrored from vedge-core — bodies land when the modules do.
pki            = []  # later: ["vedge-core/pki"]
steganography  = []  # later: ["vedge-core/steganography"]
sync           = []  # later: ["vedge-core/sync"]
full           = ["pki", "steganography", "sync"]

[lints]
workspace = true
