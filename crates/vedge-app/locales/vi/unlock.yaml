# --- PG.5a trợ giúp trong ứng dụng & bắt đầu ---
help: "Trợ giúp"
help_title: "Trợ giúp & khôi phục"
help_ek_q: "Bộ khẩn cấp là gì?"
help_ek_a: "Là tệp PDF bạn đã lưu khi tạo kho này. Nó chứa Khóa bí mật — mã mà VEdge cần, cùng với mật khẩu chính của bạn, để mở kho trên thiết bị mới hoặc khi khóa đã lưu trên máy này bị mất. Hãy cất ở nơi ngoại tuyến."
help_rk_q: "Bộ khôi phục là gì, và vì sao phải cất riêng?"
help_forgot_q: "Tôi quên mật khẩu chính"
help_forgot_a: "Chọn kho của bạn, rồi chọn \"Quên mật khẩu?\" trên bảng mở khóa. Bạn sẽ cần Khóa khôi phục và Khóa bí mật trên Bộ khẩn cấp — cả hai cùng nhau cho phép đặt mật khẩu mới. Nếu không có Khóa khôi phục, mật khẩu đã quên không thể đặt lại."
help_moved_q: "Tôi đã di chuyển tệp kho"
help_moved_a: "Không sao — một kho là một thư mục bạn có thể di chuyển hoặc sao chép. Nếu danh sách hiển thị là thiếu, hãy dùng \"Định vị\" để trỏ VEdge đến vị trí mới. Việc mở kho vẫn cần mật khẩu chính của bạn."
welcome_title: "Chào mừng đến với VEdge"
welcome_tagline: "Một trình quản lý mật khẩu nằm ngay trên thiết bị của bạn. Không đám mây, không tài khoản — kho của bạn không bao giờ rời khỏi máy tính này trừ khi bạn tự di chuyển."
welcome_key_point_title: "Một điều cần biết trước tiên"
welcome_key_point: "Khi bạn tạo một kho, VEdge chỉ hiển thị Khóa bí mật và Bộ khẩn cấp một lần. Hãy lưu lại — chúng, chứ không phải email đặt lại, là cách duy nhất để vào lại nếu bạn quên mật khẩu hoặc chuyển sang thiết bị mới. VEdge không thể khôi phục chúng giúp bạn."
