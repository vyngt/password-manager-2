# --- PG.5a in-app help & onboarding ---
help: "Help"
help_title: "Help & recovery"
help_ek_q: "What is an Emergency Kit?"
help_ek_a: "A PDF you saved when you created this vault. It holds your Secret Key — the code VEdge needs, together with your master password, to open the vault on a new device or if this computer's saved key is lost. Keep it somewhere offline."
help_rk_q: "What is a Recovery Kit, and why keep it separate?"
help_forgot_q: "I forgot my master password"
help_forgot_a: "Select your vault, then choose \"Forgot your password?\" on the unlock panel. You'll need your Recovery Key and your Emergency Kit's Secret Key — the two together let you set a new password. Without a Recovery Key, a forgotten password can't be reset."
help_moved_q: "I moved my vault file"
help_moved_a: "That's fine — a vault is a folder you can move or copy. If the list shows it as missing, use \"Locate\" to point VEdge at its new place. Opening it still needs your master password."
welcome_title: "Welcome to VEdge"
welcome_tagline: "A password manager that lives on your device. No cloud, no account — your vault never leaves this computer unless you move it."
welcome_key_point_title: "One thing to know first"
welcome_key_point: "When you create a vault, VEdge shows a Secret Key and an Emergency Kit once. Save them — they, not a reset email, are the only way back in if you forget your password or move to a new device. VEdge can't recover them for you."
