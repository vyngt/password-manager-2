[package]
name = "vedge-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
dotenvy = "0.15.7"
rand = "0.10.1"
thiserror = "2.0.18"
anyhow = "1.0.102"
validator = { version = "0.20.0", features = ["derive"] }
async-trait = "0.1.89"
uuid = { version = "1.23.0", features = ["serde", "v4"] }
tokio = { version = "1.51.1", features = ["test-util", "macros", "rt-multi-thread"] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher", "bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4.44", features = ["serde"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
vedge-codegen = { path = "../vedge-codegen"}

[dependencies.sea-orm]
version = "1.1.20"
features = ["sqlx-sqlite", "runtime-tokio", "macros", "sqlite-use-returning-for-3_35"]
default-features = false

[dependencies.sea-orm-migration]
version = "1.1.20"
features = ["runtime-tokio", "sqlx-sqlite", "sqlite-use-returning-for-3_35", "with-chrono", "with-time", "with-uuid"]
default-features = false
