[package]
name = "vedge-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
async-trait = "0.1"
libsqlite3-sys = { version = "*", features = ["bundled"] }

# Crypto stack — pinned to the RustCrypto 0.10 ecosystem (rand_core 0.6 era).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
aes = "0.9"
aes-kw = "0.3"
hkdf = "0.13"
sha2 = "0.11"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = { version = "0.10", features = ["serde"] }
subtle = "2"
rand = "0.10"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"

[dependencies.sea-orm]
version = "1.1.20"
default-features = false
features = ["sqlx-sqlite", "runtime-tokio", "macros", "sqlite-use-returning-for-3_35"]

[dependencies.sea-orm-migration]
version = "1.1.20"
default-features = false
features = ["runtime-tokio", "sqlx-sqlite", "sqlite-use-returning-for-3_35", "with-chrono"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[lints]
workspace = true
