[package]
name = "vedge-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
async-trait = "0.1"
libsqlite3-sys = { version = "*", features = ["bundled"] }

[dependencies.sea-orm]
version = "1.1.20"
default-features = false
features = ["sqlx-sqlite", "runtime-tokio", "macros", "sqlite-use-returning-for-3_35"]

[dependencies.sea-orm-migration]
version = "1.1.20"
default-features = false
features = ["runtime-tokio", "sqlx-sqlite", "sqlite-use-returning-for-3_35", "with-chrono"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
