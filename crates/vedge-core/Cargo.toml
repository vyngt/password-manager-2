[package]
name = "vedge-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
async-trait = "0.1"
libsqlite3-sys = { version = "*", features = ["bundled"] }

# Crypto stack (RustCrypto + friends), pinned to the versions the vault ships on.
# These pins are deliberate; `cargo deny` (see /deny.toml) is configured to accept
# the version spread they produce rather than churn them:
#   - AEAD:     chacha20poly1305 0.10  (pulls the aead 0.5 / cipher 0.4 / rand_core 0.6 era)
#   - key wrap: aes 0.9 + aes-kw 0.3   (cipher 0.5)
#   - hash/KDF: sha2 0.11 + hkdf 0.13 + hmac 0.13  (digest 0.11)
#   - argon2 0.5, subtle 2, zeroize 1, secrecy 0.10, region 3 (mlock)
#   - rand 0.10 is a SEPARATE lineage (rand_core 0.10) from the AEAD stack above.
# Mixing the AEAD stack (rand_core 0.6 / cipher 0.4 / digest 0.10) with the newer
# hash pins (digest 0.11) and rand 0.10 is why rand_core/getrandom/digest/sha2
# resolve at multiple versions in Cargo.lock — structural, not a mistake. That's
# why `[bans] multiple-versions` is `warn`, not `deny`. The actual *sealing* crates
# (chacha20poly1305, aes, aes-kw, zeroize, subtle) are single-version.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
aes = "0.9"
aes-kw = "0.3"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = { version = "0.10", features = ["serde"] }
subtle = "2"
rand = "0.10"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
tracing = { version = "0.1", features = ["attributes"] }
arboard = { version = "3", default-features = false }
indexmap = "2"
region = "3"
sha1 = "0.11"
data-encoding = "2"
# Async file I/O primitives for BlobStore. `vedge-core` does not create a
# runtime — callers (shells) supply one.
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "sync", "time", "macros"] }
zxcvbn = { version = "3", default-features = false }

[dependencies.sea-orm]
version = "1.1.20"
default-features = false
features = ["sqlx-sqlite", "runtime-tokio", "macros", "sqlite-use-returning-for-3_35"]

[dependencies.sea-orm-migration]
version = "1.1.20"
default-features = false
features = ["runtime-tokio", "sqlx-sqlite", "sqlite-use-returning-for-3_35", "with-chrono"]

# Windows Hello (slice 2.8) — TPM-gated KEK release via KeyCredentialManager. Only
# compiled on Windows; other targets use the stub authenticator.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
    # AllowSetForegroundWindow — let the Hello broker surface its prompt over the app.
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "time"] }
tempfile = "3"
tracing-subscriber = "0.3"

[lints]
workspace = true
