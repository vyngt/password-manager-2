[package]
name = "vedge-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.19", features = ["csr"] }
leptos_icons = "0.7.1"
leptos_router = "0.8.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
web-sys = { version = "0.3.95", features = ["HtmlElement", "Element", "Window", "Document", "DomRect", "MouseEvent", "PointerEvent", "KeyboardEvent", "FocusEvent", "HtmlInputElement", "HtmlTextAreaElement", "EventTarget", "NodeList", "DomTokenList", "CssStyleDeclaration", "Node", "File", "FileList", "DragEvent", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Navigator", "Clipboard", "ClipboardEvent"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
icondata = "0.7.0"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4.68"
uuid = { version = "1.23.1", features = ["v4", "js"] }
icondata_core = "0.1.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "wasmbind"] }
qrcodegen = "1.8"

# TODO(lint-adoption): opt into `[lints] workspace = true` after the UI-layer
# cleanup pass. Current snapshot: ~310 errors, ~914 warnings — mostly
# arithmetic_side_effects (pixel math) and indexing_slicing (DOM code).
# See docs/CoreTracking.md §"Lint adoption".
