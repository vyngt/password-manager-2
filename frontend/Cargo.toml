[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.17", features = ["csr"] }
leptos_icons = "0.6.1"
leptos_router = "0.8.13"
reactive_stores = "0.2.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
web-sys = { version = "0.3.95", features = ["HtmlElement", "Element", "Window", "Document", "DomRect", "MouseEvent", "NodeList", "DomTokenList"] }
wasm-bindgen = "0.2"
icondata = "0.6.0"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4.68"
uuid = { version = "1.23.0", features = ["v4", "js"] }
ui = {path = "../ui"}
